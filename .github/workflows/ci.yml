name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras only - the runtime has no dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert the runtime imports nothing outside the standard library
        run: python scripts/check_no_runtime_deps.py

      - name: Tests
        run: python -m pytest -q

      - name: All 15 demos, end to end
        run: python scripts/run_all_demos.py

      - name: Hosted demo adapters (the 15 live pages)
        run: python scripts/check_adapters.py
