[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-llm-systems"
version = "1.0.0"
description = "15 production-shaped applied-LLM systems that run offline on free providers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnob Rizwan Ahmad" }]
keywords = ["llm", "rag", "evaluation", "agents", "guardrails", "observability"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Arnobrizwan/applied-llm-systems"
Portfolio = "https://arnobrizwan.github.io"

[tool.setuptools]
packages = ["llmkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
python_files = ["test_*.py"]
addopts = "-q"
